# PostgreSQL només a localhost. Les credencials vénen de .env (no versionat).
# Nom fix del projecte: el contenidor es diu sempre «club-gestio-db-1» (el que esperen club-backup.sh i docs/COPIES.md),
# es digui com es digui la carpeta on és el repositori.
name: club-gestio
services:
  db:
    image: postgres:17
    restart: unless-stopped
    logging:   # sense límit, el registre del contenidor pot omplir el disc
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      POSTGRES_DB: club
      POSTGRES_USER: club
      POSTGRES_PASSWORD: ${CLUB_DB_PASSWORD:?defineix CLUB_DB_PASSWORD a .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - /data/club-gestio/pgdata:/var/lib/postgresql/data

  # Només per a proves: docker compose --profile test up -d db-test
  # Superusuari temporal (les proves creen esquemes i rols), dades a memòria, sense persistència.
  db-test:
    profiles: ["test"]
    image: postgres:17
    environment:
      POSTGRES_DB: club
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club-test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    # URL per a CLUB_TEST_PG_URL: postgresql+psycopg://club:club-test@127.0.0.1:5434/club
