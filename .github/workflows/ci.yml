name: CI

on:
  push:
    branches: [main, master, "revision-*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Superusuari: les proves creen esquemes i rols (CREATE SCHEMA, CREATE ROLE) en una base temporal.
          POSTGRES_USER: club
          POSTGRES_PASSWORD: club-ci
          POSTGRES_DB: club
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U club -d club"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Format SQLAlchemy amb el driver psycopg 3 (el mateix que fa servir l'aplicació)
      CLUB_TEST_PG_URL: postgresql+psycopg://club:club-ci@127.0.0.1:5432/club
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Proves (PostgreSQL real, cap prova saltada)
        working-directory: backend
        run: python -m pytest -q -rs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Proves del front (sense dependències)
        working-directory: frontend
        run: node --test test/

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vulnerabilitats conegudes a les dependències
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt --strict

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n i shellcheck
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck scripts/*.sh
