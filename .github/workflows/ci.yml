name: CI

on:
  push:
    branches: [main, master, "revision-*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Superusuari: les proves creen esquemes i rols (CREATE SCHEMA, CREATE ROLE) en una base temporal.
          POSTGRES_USER: club
          POSTGRES_PASSWORD: club-ci
          POSTGRES_DB: club
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U club -d club"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Format SQLAlchemy amb el driver psycopg 3 (el mateix que fa servir l'aplicació)
      CLUB_TEST_PG_URL: postgresql+psycopg://club:club-ci@127.0.0.1:5432/club
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      # Les MATEIXES versions (i hashes) que va a producció: abans s'instal·lava requirements-dev.txt, que no fixa les
      # dependències indirectes (starlette…), i la CI podia provar una cosa diferent de la que es desplega.
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Proves (PostgreSQL real; tests/conftest.py falla si n'hi ha cap de saltada)
        working-directory: backend
        run: python -m pytest -q -rs

  copies:
    # Prova de punta a punta de les còpies: còpia xifrada i signada, restauració, manipulació, clau equivocada i retenció.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m venv .venv
          .venv/bin/pip install -q --require-hashes -r requirements.lock
      - name: scripts/test-backup.sh (Docker + GPG temporals)
        run: bash scripts/test-backup.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sintaxi de tots els .js del front
        working-directory: frontend
        run: for f in *.js; do node --check "$f"; done
      - name: Proves del front (sense dependències)
        working-directory: frontend
        run: node --test "test/*.test.js"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vulnerabilitats conegudes a les dependències
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt --strict
          pip-audit -r requirements.lock --require-hashes --strict
      - name: El lock s'instal·la amb hashes obligatoris
        run: python -m pip install --dry-run --require-hashes -r requirements.lock

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n i shellcheck
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck scripts/*.sh

  fitxers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tots els fitxers de text versionats són UTF-8 vàlid i sense NUL
        run: |
          python3 - <<'PY'
          import subprocess, sys
          exts = (".py", ".js", ".sh", ".yml", ".yaml", ".md", ".html", ".css", ".conf", ".service", ".timer", ".json", ".txt", ".lock", ".webmanifest", ".svg")
          dolents = []
          for f in subprocess.check_output(["git", "ls-files"], text=True).splitlines():
              if not f.endswith(exts):
                  continue
              b = open(f, "rb").read()
              try:
                  b.decode("utf-8")
              except UnicodeDecodeError as e:
                  dolents.append(f"{f}: no és UTF-8 ({e})")
              if b"\x00" in b:
                  dolents.append(f"{f}: conté bytes NUL (bash els ignora en silenci)")
          print("\n".join(dolents) or "tots OK")
          sys.exit(1 if dolents else 0)
          PY
      - name: docker-compose.yml és vàlid
        run: CLUB_DB_PASSWORD=x docker compose config -q
