# Exemple complet de nginx per al club. Copia a /etc/nginx/conf.d/club.conf i adapta els valors marcats amb <>.
# NOTA: només cal si el servei s'exposa amb nginx (servidor de proves públic). El club real va per Tailscale, sense nginx ni
# certbot: vegeu docs/PRODUCCIO.md § 0 (`tailscale serve`).
# Al servei (app.env): CLUB_TRUST_PROXY=1. NO posis CLUB_HSTS=1 amb aquest nginx: l'HSTS ja l'envia nginx (si no, va duplicat). Amb CLUB_TRUST_PROXY=1 l'app només fa cas de L'ÚLTIMA entrada de
# X-Forwarded-For (la que afegeix aquest nginx), per això NO es passa la capçalera del client sense més: s'hi afegeix $remote_addr.
# Si nginx és darrere d'un altre proxy, canvia el pas de X-Forwarded-For (vegeu el comentari) o la IP serà la del proxy.

# 30 peticions/min per IP a /auth/ (contrasenya i carnet+PIN). Alt a posta: les tauletes d'un mateix local surten amb la mateixa IP
# i en un canvi de torn entren totes alhora (amb 10/min rebien 429). El bloqueig fi per usuari el fa l'aplicació.
limit_req_zone $binary_remote_addr zone=club_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=club_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=club_conn:10m;

upstream club_app {
    server 127.0.0.1:8099;
    keepalive 16;
}

server {
    listen 80;
    server_name <club.exemple.cat>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;   # «http2 on;» només existeix a nginx >= 1.25.1; així funciona amb totes les versions
    server_name <club.exemple.cat>;

    ssl_certificate     /etc/letsencrypt/live/<club.exemple.cat>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<club.exemple.cat>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    # (sense ssl_stapling: Let's Encrypt va deixar d'oferir OCSP el 2025 i nginx només hi donaria avisos)

    # No filtrem versió ni accessos amb documents/codis a la URL
    server_tokens off;
    access_log /var/log/nginx/club.access.log combined_sense_query;   # IMPRESCINDIBLE: defineix log_format a http { } (vegeu a sota)
    error_log  /var/log/nginx/club.error.log warn;

    # Igual que el límit de l'app (CLUB_MAX_BODY_BYTES, 1 MiB): la foto/signatura més gran en base64 fa ~400 KB
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn club_conn 30;

    # Capçaleres (l'app ja envia CSP, X-Frame-Options i no-store; aquí només el que afegeix la capa HTTP)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "serial=(self), camera=(), microphone=(), geolocation=()" always;

    # Inici de sessió: límit estricte (l'app també bloqueja 5 intents/15 min per usuari)
    location /auth/ {
        limit_req zone=club_auth burst=15 nodelay;
        limit_req_status 429;
        include /etc/nginx/club-proxy.inc;
    }

    location / {
        limit_req zone=club_api burst=40 nodelay;
        include /etc/nginx/club-proxy.inc;
    }

    # Monitoratge intern: només des del propi servidor
    location = /salut {
        allow 127.0.0.1;
        deny all;
        include /etc/nginx/club-proxy.inc;
    }
}

# --- a http { } (nginx.conf): log sense query string (hi poden anar documents o codis de carnet) ---
